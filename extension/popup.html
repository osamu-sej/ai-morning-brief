<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <title>AI Morning Brief</title>
    <style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:14px;min-width:300px}button{width:100%;padding:9px}pre{white-space:pre-wrap;max-height:300px;overflow:auto;font-size:11px}</style>
  </head>
  <body>
    <strong>AI Morning Brief</strong>
    <p>通常ChromeのGemini Notebookを操作します。ログイン情報は取得しません。</p>
    <button id="run-daily-now">通しテストを実行（新規Notebook → 記事追加 → 音声解説生成）</button>
    <button id="enable-daily">毎朝5時の自動実行を有効化</button>
    <button id="daily-status">日次自動実行の状態を確認</button>
    <details>
      <summary>診断・個別テスト（通常は使いません）</summary>
      <button id="inspect">このNotebookLMタブを診断</button>
      <button id="audio-diagnostics">音声解説タイルを診断</button>
      <button id="create-inspect">新規作成画面を診断</button>
      <button id="source-inspect">ソース追加画面を診断</button>
      <button id="upload-latest">ローカル日次資料をテスト投入</button>
      <button id="paste-latest">ローカル日次資料をテキストとして追加</button>
      <button id="generate-audio">音声解説を生成</button>
      <button id="start-audio">このNotebookの音声解説を自動開始</button>
    </details>
    <pre id="result"></pre>
    <script type="module" src="popup.js"></script>
  </body>
</html>
